<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Timezone Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Timezone Converter using JavaScript to convert time between different countries.">
    <meta name="author" content="Raghav Arora">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #020024, #090979, #000);
            color: #fff;
        }

        .container {
            width: 360px;
            background: #111;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            margin-top: 10px;
            display: block;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #00ffff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            margin-top: 15px;
            font-size: 18px;
            text-align: center;
            color: #00ffff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Timezone Converter</h2>

        <label>Select Time</label>
        <input type="datetime-local" id="time">

        <label>From Timezone</label>
        <select id="from">
            <option value="Asia/Kolkata">India (IST)</option>
            <option value="UTC">UTC</option>
            <option value="America/New_York">USA (New York)</option>
            <option value="Europe/London">UK (London)</option>
            <option value="Asia/Tokyo">Japan</option>
        </select>

        <label>To Timezone</label>
        <select id="to">
            <option value="UTC">UTC</option>
            <option value="Asia/Kolkata">India (IST)</option>
            <option value="America/New_York">USA (New York)</option>
            <option value="Europe/London">UK (London)</option>
            <option value="Asia/Tokyo">Japan</option>
        </select>

        <button onclick="convertTime()">Convert Time</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        function convertTime() {
            const timeInput = document.getElementById("time").value;
            const fromTZ = document.getElementById("from").value;
            const toTZ = document.getElementById("to").value;
            const result = document.getElementById("result");

            if (!timeInput) {
                alert("Please select date & time");
                return;
            }

            const date = new Date(timeInput);

            const fromTime = new Intl.DateTimeFormat("en-US", {
                timeZone: fromTZ,
                dateStyle: "medium",
                timeStyle: "medium"
            }).format(date);

            const toTime = new Intl.DateTimeFormat("en-US", {
                timeZone: toTZ,
                dateStyle: "medium",
                timeStyle: "medium"
            }).format(date);

            result.innerHTML = `
    <div>From: ${fromTime}</div>
    <div>To: ${toTime}</div>
  `;
        }
    </script>

</body>

</html>
